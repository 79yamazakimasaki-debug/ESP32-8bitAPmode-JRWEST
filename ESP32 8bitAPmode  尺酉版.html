<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>LEDエディタ V17.0 (尺酉専用・右詰め対応版・Wi-Fi転送)</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 380px; background: #1e1e1e; border-right: 1px solid #333; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        #main { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; box-sizing: border-box; }
        .group { background: #2a2a2a; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #444; }
        .group h3 { margin-top: 0; font-size: 14px; color: #3498db; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .item-list { margin-top: 10px; max-height: 120px; overflow-y: auto; background: #111; padding: 5px; border-radius: 4px; }
        .item { font-size: 11px; padding: 4px; border-bottom: 1px solid #222; }
        .btn { border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; font-weight: bold; }
        .btn-add { background: #27ae60; color: white; width: 100%; margin-top: 5px; }
        .btn-save { background: #8e44ad; color: white; width: 48%; }
        .btn-load { background: #d35400; color: white; width: 48%; }
        .btn-transfer { background: #3498db; color: white; margin-top: 10px; padding: 15px; font-weight: bold; width: 100%; font-size: 16px; border: 2px solid #fff; }
        canvas { background: #000; border: 2px solid #555; image-rendering: pixelated; width: 100%; max-width: 640px; }
        select, input[type="text"], input[type="number"], input[type="range"] { width: 100%; padding: 8px; background: #333; color: white; border: 1px solid #555; margin: 5px 0; border-radius: 4px; box-sizing: border-box; }
        .mode-select { display: flex; gap: 10px; margin-bottom: 10px; background: #333; padding: 10px; border-radius: 5px; flex-wrap: wrap; font-size: 13px; }
        #progress-bar { height: 8px; background: #27ae60; width: 0%; transition: 0.1s; margin-top: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>素材ライブラリ</h2>
    
    <div class="group" style="background: #1a2a3a;">
        <h3>ESP32-S3 Wi-Fi接続 (APモード)</h3>
        <small style="color:#3498db; font-weight:bold;">ESP32のIPアドレス</small>
        <input type="text" id="esp-ip" value="192.168.4.1" style="font-size:14px; font-weight:bold; text-align:center;">
    </div>

    <div class="group" style="background: #2c3e50;">
        <h3>レイアウト幅設定</h3>
        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <small style="color:#e74c3c; font-weight:bold;">実際のLED物理幅</small>
                <input type="number" id="hardware-width" value="160" min="64" max="256" onchange="updateUI()">
            </div>
            <div style="flex:1;">
                <small style="color:#f1c40f;">表示する横幅</small>
                <input type="number" id="panel-width" value="160" min="64" max="256" onchange="updateUI()">
            </div>
        </div>
    </div>
    
    <div class="group" style="background: #2c3e50;">
        <h3>色合い・輝度調整</h3>
        <small>LED全体の明るさ : <span id="val-hw-bright">12</span></small>
        <input type="range" id="hw-brightness" min="1" max="50" step="1" value="12" oninput="document.getElementById('val-hw-bright').innerText=this.value">
        <small>色の明るさ (Software) : <span id="val-brightness">1.0</span></small>
        <input type="range" id="brightness" min="0.1" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('val-brightness').innerText=this.value;">
        <small>ガンマ補正 : <span id="val-gamma">1.5</span></small>
        <input type="range" id="gamma" min="0.1" max="3.0" step="0.1" value="1.5" oninput="document.getElementById('val-gamma').innerText=this.value;">
    </div>

    <div class="group" style="background: #2c3e50;">
        <h3>表示時間設定 (秒)</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <div id="box-time0" style="flex: 1; min-width: 45%;"><small>1画面目</small><input type="number" id="time-scene0" value="3.0" min="0.1" step="0.1"></div>
            <div id="box-time1" style="flex: 1; min-width: 45%;"><small>2画面目</small><input type="number" id="time-scene1" value="3.0" min="0.1" step="0.1"></div>
            <div id="box-time2" style="flex: 1; min-width: 45%;"><small>3画面目</small><input type="number" id="time-scene2" value="3.0" min="0.1" step="0.1"></div>
            <div id="box-time3" style="flex: 1; min-width: 45%;"><small>4画面目</small><input type="number" id="time-scene3" value="3.0" min="0.1" step="0.1"></div>
        </div>
    </div>

    <div style="display: flex; gap: 4%; margin-bottom: 15px;">
        <button class="btn btn-save" onclick="saveProject()">💾 保存</button>
        <button class="btn btn-load" onclick="document.getElementById('projectFile').click()">📂 読込</button>
        <input type="file" id="projectFile" style="display:none" accept=".json" onchange="loadProject(this)">
    </div>
    <div id="libraries"></div>
</div>

<div id="main">
    <h2>表示システム V17.0 (160×32 右詰め・Wi-Fi転送)</h2>
    <div class="group">
        <div class="mode-select">
            <label><input type="radio" name="main-mode" id="mode-std" checked onchange="updateUI()"> 通常モード</label>
            <label><input type="radio" name="main-mode" id="mode-full" onchange="updateUI()"> 全画面モード</label>
        </div>
        <div id="options-area">
            <span id="std-options-box">
                <label><input type="checkbox" id="chk-info" onchange="updateUI()"> 案内表示有</label>
                <span id="info-eng-box" style="display:none; margin-left:15px;">
                    <label><input type="checkbox" id="chk-info-eng" onchange="updateUI()"> 案内英有</label>
                </span>
                <span style="margin-left:15px;">
                    <label><input type="checkbox" id="chk-info-full" onchange="updateUI()"> 案内全画面有</label>
                </span>
            </span>
        </div>
    </div>
    
    <div id="selectors" class="group"><h3>素材選択</h3></div>
    
    <div class="group">
        <h3>リアルタイムプレビュー</h3>
        <canvas id="preview-canvas" height="32" style="height:128px;"></canvas>
        <div id="progress-bar"></div>
        <button id="transfer-btn" class="btn btn-transfer" onclick="transferToESP32()">⚡ ESP32-S3へ Wi-Fi 転送</button>
    </div>
</div>

<script>
    const categories = [
        { id: 'type', name: '種別 (64×32)', w: 64, h: 32 },
        { id: 'dest_ja', name: '行先日 (81×18)', w: 81, h: 18 },
        { id: 'dest_en', name: '行先英 (81×14)', w: 81, h: 14 },
        { id: 'info_ja', name: '案内日 (81×14)', w: 81, h: 14 },
        { id: 'info_en', name: '案内英 (81×14)', w: 81, h: 14 },
        { id: 'full', name: '全画面 (145×32)', w: 145, h: 32 },
        { id: 'car', name: '号車 (15×32)', w: 15, h: 32 },
        { id: 'info_full', name: '案内全画面 (160×32)', w: 160, h: 32 }
    ];
    
    let library = {}; 
    categories.forEach(c => library[c.id] = []);
    let previewSceneIdx = 0, lastPreviewChange = Date.now();

    function init() {
        const libDiv = document.getElementById('libraries');
        categories.forEach(c => {
            libDiv.innerHTML += `
                <div class="group">
                    <h3>${c.name}</h3>
                    <div id="list-${c.id}" class="item-list"></div>
                    <button class="btn btn-add" onclick="document.getElementById('file-${c.id}').click()">追加</button>
                    <input type="file" id="file-${c.id}" style="display:none" onchange="handleUpload(this,'${c.id}')">
                </div>`;
        });
        updateUI(); 
        requestAnimationFrame(animate);
    }

    function handleUpload(input, catId) {
        const file = input.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                const cat = categories.find(c => c.id === catId);
                const cv = document.createElement('canvas'); cv.width = cat.w; cv.height = cat.h;
                const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, cat.w, cat.h);
                const raw = ctx.getImageData(0,0,cat.w,cat.h).data;
                const data = new Uint8Array(cat.w * cat.h * 3);
                for(let i=0; i<cat.w*cat.h; i++) {
                    data[i*3+0] = raw[i*4+0]; data[i*3+1] = raw[i*4+1]; data[i*3+2] = raw[i*4+2]; 
                }
                library[catId].push({ name: file.name.split('.')[0], data, w: cat.w, h: cat.h });
                updateLibraryUI(catId); updateUI();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function updateLibraryUI(id) { 
        document.getElementById('list-'+id).innerHTML = library[id].map((item, idx) => `
            <div class="item" style="display: flex; justify-content: space-between; align-items: center; background: #222; margin-bottom: 4px; padding: 6px; border-radius: 4px;">
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px;">${item.name}</span>
                <div style="display: flex; gap: 3px;">
                    <button class="btn" style="padding: 2px 5px; font-size: 10px;" onclick="moveItem('${id}', ${idx}, -1)">🔼</button>
                    <button class="btn" style="padding: 2px 5px; font-size: 10px;" onclick="moveItem('${id}', ${idx}, 1)">🔽</button>
                    <button class="btn" style="padding: 2px 5px; font-size: 10px; background: #c0392b;" onclick="deleteItem('${id}', ${idx})">❌</button>
                </div>
            </div>
        `).join(''); 
    }

    function moveItem(id, idx, dir) {
        const tid = idx + dir; if (tid < 0 || tid >= library[id].length) return;
        const tmp = library[id][idx]; library[id][idx] = library[id][tid]; library[id][tid] = tmp;
        updateLibraryUI(id); updateUI();
    }

    function deleteItem(id, idx) {
        if (confirm("削除しますか？")) { library[id].splice(idx, 1); updateLibraryUI(id); updateUI(); }
    }

    function updateUI() {
        const mode = document.querySelector('input[name="main-mode"]:checked').id;
        const info = document.getElementById('chk-info').checked;
        const infoEng = document.getElementById('chk-info-eng') ? document.getElementById('chk-info-eng').checked : false;
        const infoFull = document.getElementById('chk-info-full') ? document.getElementById('chk-info-full').checked : false;

        document.getElementById('std-options-box').style.display = (mode === 'mode-std') ? 'inline' : 'none';
        if(document.getElementById('info-eng-box')) document.getElementById('info-eng-box').style.display = (mode === 'mode-std' && info) ? 'inline' : 'none';

        let scCount = 1;
        if (mode === 'mode-std') {
            if (info) scCount = infoEng ? 3 : 2;
            if (infoFull) scCount += 1; 
        }
        
        document.getElementById('box-time1').style.display = (scCount >= 2) ? 'block' : 'none';
        document.getElementById('box-time2').style.display = (scCount >= 3) ? 'block' : 'none';
        document.getElementById('box-time3').style.display = (scCount >= 4) ? 'block' : 'none';

        const hw = parseInt(document.getElementById('hardware-width').value) || 160;
        document.getElementById('preview-canvas').style.maxWidth = hw * 4 + "px";

        const selDiv = document.getElementById('selectors');
        selDiv.innerHTML = '<h3>素材選択</h3>';

        let req = [];
        if (mode === 'mode-full') {
            req = ['full', 'car'];
        } else {
            req = ['type', 'dest_ja', 'dest_en', 'car'];
            if (info) req.push('info_ja');
            if (info && infoEng) req.push('info_en');
            if (infoFull) req.push('info_full'); 
        }

        req.forEach(id => {
            const cat = categories.find(c => c.id === id);
            let opts = library[id].map((it, idx) => `<option value="${idx}">${it.name}</option>`).join('');
            selDiv.innerHTML += `<div><small>${cat.name}</small><select id="sel-${id}">${opts}</select></div>`;
        });
    }

    function animate() {
        const cv = document.getElementById('preview-canvas'); const ctx = cv.getContext('2d');
        const hw = parseInt(document.getElementById('hardware-width').value) || 160;
        const pw = parseInt(document.getElementById('panel-width').value) || 160;
        const margin = Math.max(0, hw - pw); 

        cv.width = hw; cv.height = 32; ctx.fillStyle = 'black'; ctx.fillRect(0,0,hw,32);
        
        const mode = document.querySelector('input[name="main-mode"]:checked').id;
        const info = document.getElementById('chk-info').checked;
        const infoEng = document.getElementById('chk-info-eng') ? document.getElementById('chk-info-eng').checked : false;
        const infoFull = document.getElementById('chk-info-full') ? document.getElementById('chk-info-full').checked : false;
        
        const getSel = (id) => { const el = document.getElementById('sel-'+id); return (el && library[id][el.value]) ? library[id][el.value] : null; };

        let scCount = 1;
        if (mode === 'mode-std') {
            if (info) scCount = infoEng ? 3 : 2;
            if (infoFull) scCount += 1;
        }
        if (previewSceneIdx >= scCount) previewSceneIdx = 0;

        const now = Date.now();
        let intervals = [
            (parseFloat(document.getElementById('time-scene0').value) || 3.0) * 1000,
            (parseFloat(document.getElementById('time-scene1').value) || 3.0) * 1000,
            (parseFloat(document.getElementById('time-scene2').value) || 3.0) * 1000,
            (parseFloat(document.getElementById('time-scene3').value) || 3.0) * 1000 
        ];

        if(now - lastPreviewChange > intervals[previewSceneIdx]) { 
            previewSceneIdx = (previewSceneIdx + 1) % scCount; lastPreviewChange = now; 
        }

        const drawPart = (item, x, y) => {
            if(!item) return; const img = ctx.createImageData(item.w, item.h);
            const br = parseFloat(document.getElementById('brightness').value);
            const gam = parseFloat(document.getElementById('gamma').value);
            for(let i=0; i<item.w*item.h; i++) {
                let lx = i % item.w;
                if ((x + lx) >= pw) { 
                    img.data[i*4+0]=0; img.data[i*4+1]=0; img.data[i*4+2]=0; img.data[i*4+3]=255;
                    continue;
                }
                for(let c=0; c<3; c++) {
                    let v = item.data[i*3+c];
                    let nv = Math.pow(v / 255.0, gam) * br * 255;
                    let q = Math.min(255, Math.max(0, Math.round(nv)));
                    img.data[i*4+c] = q; 
                }
                img.data[i*4+3] = 255;
            }
            ctx.putImageData(img, x + margin, y);
        };

        const s = previewSceneIdx;
        if (mode === 'mode-full') {
            drawPart(getSel('full'), 0, 0); drawPart(getSel('car'), 145, 0);
        } else {
            if (infoFull && s === scCount - 1) {
                drawPart(getSel('info_full'), 0, 0);
            } else {
                drawPart(getSel('type'), 0, 0); drawPart(getSel('car'), 145, 0);
                if (!info) {
                    drawPart(getSel('dest_ja'), 64, 0); drawPart(getSel('dest_en'), 64, 18);
                } else {
                    if (s === 0) { drawPart(getSel('dest_ja'), 64, 0); drawPart(getSel('dest_en'), 64, 18); }
                    else if (s === 1) { drawPart(getSel('dest_ja'), 64, 0); drawPart(getSel('info_ja'), 64, 18); }
                    else if (s === 2 && infoEng) { drawPart(getSel('dest_ja'), 64, 0); drawPart(getSel('info_en'), 64, 18); }
                }
            }
        }
        requestAnimationFrame(animate);
    }

    async function transferToESP32() {
        const btn = document.getElementById('transfer-btn'); 
        const bar = document.getElementById('progress-bar');
        btn.disabled = true; 
        bar.style.width = "0%";
        
        const hw = parseInt(document.getElementById('hardware-width').value) || 160;
        const pw = parseInt(document.getElementById('panel-width').value) || 160;
        const margin = Math.max(0, hw - pw); 

        const mode = document.querySelector('input[name="main-mode"]:checked').id;
        const info = document.getElementById('chk-info').checked;
        const infoEng = document.getElementById('chk-info-eng') ? document.getElementById('chk-info-eng').checked : false;
        const infoFull = document.getElementById('chk-info-full') ? document.getElementById('chk-info-full').checked : false;
        const getSel = (id) => { const el = document.getElementById('sel-'+id); return (el && library[id][el.value]) ? library[id][el.value] : null; };

        try {
            let scCount = 1;
            if (mode === 'mode-std') {
                if (info) scCount = infoEng ? 3 : 2;
                if (infoFull) scCount += 1;
            }

            const t0 = Math.round((parseFloat(document.getElementById('time-scene0').value) || 3.0) * 1000);
            const t1 = Math.round((parseFloat(document.getElementById('time-scene1').value) || 3.0) * 1000);
            const t2 = Math.round((parseFloat(document.getElementById('time-scene2').value) || 3.0) * 1000);
            const t3 = Math.round((parseFloat(document.getElementById('time-scene3').value) || 3.0) * 1000);

            const hw_bright = parseInt(document.getElementById('hw-brightness').value);

            let totalSize = 20 + (scCount * 8 * 16 * hw);
            let allData = new Uint8Array(totalSize);
            
            allData.set([
                0xAA, 0x56, scCount, 0, 0, 0, 80 + margin, 
                t0 & 0xFF, (t0 >> 8) & 0xFF,
                t1 & 0xFF, (t1 >> 8) & 0xFF,
                t2 & 0xFF, (t2 >> 8) & 0xFF,
                t3 & 0xFF, (t3 >> 8) & 0xFF,
                0, 0,
                hw_bright & 0xFF,
                hw & 0xFF, (hw >> 8) & 0xFF 
            ], 0);

            let offset = 20;

            for(let s=0; s<scCount; s++) {
                let frame = Array(8).fill().map(() => Array(16).fill().map(() => Array(hw).fill(0)));
                
                const putPart = (item, x_off, y_off) => {
                    if(!item) return;
                    const br = parseFloat(document.getElementById('brightness').value);
                    const gam = parseFloat(document.getElementById('gamma').value);
                    for(let y=0; y<item.h; y++) for(let x=0; x<item.w; x++) {
                        let tx = x + x_off;
                        if(tx >= pw) continue; 
                        
                        let targetX = tx + margin; 
                        let ty = y + y_off;
                        if(targetX >= hw || ty >= 32) continue;
                        
                        let rgb = [0, 0, 0];
                        for(let c=0; c<3; c++) {
                            let v = item.data[(y*item.w+x)*3+c];
                            let nv = Math.pow(v / 255.0, gam) * br * 255;
                            rgb[c] = Math.min(255, Math.max(0, Math.round(nv)));
                        }
                        let r = rgb[0], g = rgb[1], b = rgb[2];

                        for(let bit=0; bit<8; bit++) {
                            if((r>>bit)&1) frame[bit][ty%16][targetX] |= (ty<16?0x01:0x08);
                            if((g>>bit)&1) frame[bit][ty%16][targetX] |= (ty<16?0x02:0x10);
                            if((b>>bit)&1) frame[bit][ty%16][targetX] |= (ty<16?0x04:0x20);
                        }
                    }
                };

                if (mode === 'mode-full') {
                    putPart(getSel('full'), 0, 0); putPart(getSel('car'), 145, 0);
                } else {
                    if (infoFull && s === scCount - 1) {
                        putPart(getSel('info_full'), 0, 0);
                    } else {
                        putPart(getSel('type'), 0, 0); putPart(getSel('car'), 145, 0);
                        if (!info) {
                            putPart(getSel('dest_ja'), 64, 0); putPart(getSel('dest_en'), 64, 18);
                        } else {
                            if (s === 0) { putPart(getSel('dest_ja'), 64, 0); putPart(getSel('dest_en'), 64, 18); }
                            else if (s === 1) { putPart(getSel('dest_ja'), 64, 0); putPart(getSel('info_ja'), 64, 18); }
                            else if (s === 2 && infoEng) { putPart(getSel('dest_ja'), 64, 0); putPart(getSel('info_en'), 64, 18); }
                        }
                    }
                }

                for(let b=0; b<8; b++) {
                    for(let y=0; y<16; y++) {
                        for(let x=0; x<hw; x++) { allData[offset++] = frame[b][y][x]; }
                    }
                }
                bar.style.width = ((s+1)/scCount * 40) + "%";
            }

            btn.innerText = `⏳ Wi-Fi転送中...`;
            bar.style.width = "50%";

            const ip = document.getElementById('esp-ip').value || '192.168.4.1';
            const formData = new FormData();
            formData.append('file', new Blob([allData]));

            const res = await fetch(`http://${ip}/update`, {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                bar.style.width = "100%"; 
                alert("Wi-Fi転送が完了しました！");
            } else {
                throw new Error("HTTPエラー: " + res.status);
            }

        } catch(e) {
            alert(`エラー: ${e.message}`);
        } finally {
            btn.disabled = false; 
            btn.innerText = "⚡ ESP32-S3へ Wi-Fi 転送"; 
            if (bar.style.width !== "100%") bar.style.width = "0%";
        }
    }

    function saveProject() {
        const d = {}; categories.forEach(c => d[c.id] = library[c.id].map(it => ({name:it.name, data:Array.from(it.data), w:it.w, h:it.h})));
        const b = new Blob([JSON.stringify(d)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'led_160_project.json'; a.click();
    }
    function loadProject(i) {
        const r = new FileReader(); r.onload = e => {
            const ld = JSON.parse(e.target.result);
            categories.forEach(c => { if(ld[c.id]) library[c.id] = ld[c.id].map(it => ({name:it.name, data:new Uint8Array(it.data), w:it.w, h:it.h})); updateLibraryUI(c.id); });
            updateUI();
        }; r.readAsText(i.files[0]);
    }

    init();
</script>
</body>
</html>
